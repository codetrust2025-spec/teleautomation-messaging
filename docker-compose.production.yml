# Authoritative unified production stack for the split. PREPARED, NOT DEPLOYED.
#
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# Deliberately close to the staging stack that has been verified, because the
# value of staging evidence drops with every difference between the two. What
# differs, and only what differs:
#
#   - real production hostnames, so the built frontends point at the right peer
#   - separate loopback ports, so this can be brought up beside the monolith
#     during cutover without taking a port it is using
#   - the existing host nginx terminates TLS, as it already does for production
#
# The monolith keeps running on its own port and database throughout. This stack
# does not stop it, migrate it, or share anything with it.
#
# Ports are loopback-only. Nothing here is reachable from the internet except
# through the nginx server blocks in deploy/production/nginx-production.conf.template.

name: teleautomation-production

# Operations is an independently reviewed release. Pinning its build argument
# here prevents an environment typo from labelling a different checkout as the
# approved production release. The source checkout must still be verified at
# this exact commit before any build.
x-release-shas:
  operations: &operations-release c01e41d26270c2b3427722803932fbc38b726975

x-capped-logs: &capped
  driver: json-file
  options: { max-size: "50m", max-file: "5" }

services:
  marketing-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MARKETING_DB_USER:?}
      POSTGRES_PASSWORD: ${MARKETING_DB_PASSWORD:?}
      POSTGRES_DB: ${MARKETING_DB_NAME:?}
    volumes: [marketing_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *capped

  operations-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OPERATIONS_DB_USER:?}
      POSTGRES_PASSWORD: ${OPERATIONS_DB_PASSWORD:?}
      POSTGRES_DB: ${OPERATIONS_DB_NAME:?}
    volumes: [operations_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *capped

  marketing-migrate:
    build:
      context: ../teleautomation-messaging
      args:
        RELEASE_SHA: ${RELEASE_SHA_MARKETING:?}
        VITE_OPERATIONS_PUBLIC_URL: https://operations.teleautomation.online
    environment:
      DATABASE_URL: ${MARKETING_DATABASE_URL:?}
      DASHBOARD_PASSWORD: ${MARKETING_DASHBOARD_PASSWORD:?}
    command: ["python", "-m", "core.migrations.runner"]
    depends_on: { marketing-db: { condition: service_healthy } }
    restart: "no"
    logging: *capped

  operations-migrate:
    build:
      context: ../teleautomation-business
      args:
        RELEASE_SHA: *operations-release
        VITE_OPERATIONS_PUBLIC_URL: https://operations.teleautomation.online
        VITE_MARKETING_PUBLIC_URL: https://marketing.teleautomation.online
    environment:
      DATABASE_URL: ${OPERATIONS_DATABASE_URL:?}
      DASHBOARD_PASSWORD: ${OPERATIONS_DASHBOARD_PASSWORD:?}
    command: ["python", "-m", "core.migrations.runner"]
    depends_on: { operations-db: { condition: service_healthy } }
    restart: "no"
    logging: *capped

  marketing-api:
    build:
      context: ../teleautomation-messaging
      args:
        RELEASE_SHA: ${RELEASE_SHA_MARKETING:?}
        VITE_OPERATIONS_PUBLIC_URL: https://operations.teleautomation.online
    restart: unless-stopped
    environment:
      SERVICE_NAME: teleautomation-messaging
      DATABASE_URL: ${MARKETING_DATABASE_URL:?}
      MARKETING_DATA_DIR: /var/lib/teleautomation-marketing
      TELEGRAM_SESSION_DIR: /var/lib/teleautomation-marketing
      # Peer over the private compose network, never a public hostname: a
      # service-to-service call has no reason to leave the host, and routing it
      # through the internet would add TLS, DNS and the proxy to a path that
      # needs none of them.
      OPERATIONS_INTERNAL_URL: http://operations-api:8000
      OPERATIONS_PUBLIC_URL: https://operations.teleautomation.online
      PUBLIC_BASE_URL: https://marketing.teleautomation.online
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?}
      DASHBOARD_USERNAME: ${MARKETING_DASHBOARD_USERNAME:?}
      DASHBOARD_PASSWORD: ${MARKETING_DASHBOARD_PASSWORD:?}
      DASHBOARD_AUTH_SECRET: ${MARKETING_AUTH_SECRET:?}
      DASHBOARD_COOKIE_SECURE: "true"
      TELEAUTOMATION_SAFE_UI_MODE: "false"
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?}

      # WhatsApp. Required, not optional: is_whatsapp_enabled() defaults to
      # false when WHATSAPP_ENABLED is unset (core/config.py:66), and the ingest
      # route then answers HTTP 200 with ignored=whatsapp_disabled
      # (core/whatsapp_api.py:36). The BSP reads 200 as delivered and never
      # retries, so every inbound message is lost with nothing logged as an
      # error. Marked required so a missing value stops the deploy instead.
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:?}
      WHATSAPP_BSP: ${WHATSAPP_BSP:-interakt}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:?}
      # interakt authenticates by signature; this is a Meta Cloud API concept
      # that production has never set and core/config.py:72 defaults to "".
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:?}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:?}

      # Web push. Also required: with no keys and a fresh volume, vapid_keys()
      # falls through to _generate_vapid_keys() and persists a NEW keypair
      # (features/web_push.py:92-96), which silently invalidates every existing
      # browser subscription. These must be the monolith's current values.
      # Left optional on purpose. features/web_push.py vapid_keys() prefers
      # these, then falls back to DATA_DIR/vapid_keys.json, then GENERATES a new
      # pair - and a new pair silently invalidates every existing subscription.
      # The private key is a multi-line PEM, which cannot survive a .env file, so
      # the key store is carried into the data volume instead and left
      # authoritative here. Deployment verifies the served public key matches
      # production before traffic moves.
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_EMAIL: ${WEB_PUSH_VAPID_EMAIL:-}

      # Carried from the monolith. Without these the AI surface degrades
      # silently rather than failing, which is how it would reach users.
      AI_API_KEY: ${AI_API_KEY:?}
      OPS_API_TOKEN: ${OPS_API_TOKEN:?}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_REASONING_MODEL: ${OLLAMA_REASONING_MODEL:-}
      DEMO_TOOLS_LOCKEDIN_MAC_URL: ${DEMO_TOOLS_LOCKEDIN_MAC_URL:-}
      DEMO_TOOLS_LOCKEDIN_WINDOWS_URL: ${DEMO_TOOLS_LOCKEDIN_WINDOWS_URL:-}
      DEMO_TOOLS_ULTRAVIEWER_URL: ${DEMO_TOOLS_ULTRAVIEWER_URL:-}
      FORWARD_REST_MAX_SECONDS: ${FORWARD_REST_MAX_SECONDS:-}
      FORWARD_REST_MIN_SECONDS: ${FORWARD_REST_MIN_SECONDS:-}
      WHATSAPP_DEFAULT_SLOT: ${WHATSAPP_DEFAULT_SLOT:-}
      WHATSAPP_MEDIA_ACCESS_TOKEN: ${WHATSAPP_MEDIA_ACCESS_TOKEN:-}
      PUBLIC_CALL_BASE_URL: ${PUBLIC_CALL_BASE_URL:-https://marketing.teleautomation.online}
      DASHBOARD_PUBLIC_URL: https://marketing.teleautomation.online
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${MARKETING_PORT:-8110}:8000"]
    volumes:
      - marketing_data:/var/lib/teleautomation-marketing
    depends_on:
      marketing-db: { condition: service_healthy }
      marketing-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *capped

  operations-api:
    build:
      context: ../teleautomation-business
      args:
        RELEASE_SHA: *operations-release
        VITE_OPERATIONS_PUBLIC_URL: https://operations.teleautomation.online
        VITE_MARKETING_PUBLIC_URL: https://marketing.teleautomation.online
    restart: unless-stopped
    environment:
      SERVICE_NAME: teleautomation-operations
      DATABASE_URL: ${OPERATIONS_DATABASE_URL:?}
      OPERATIONS_DATA_DIR: /var/lib/teleautomation-operations
      MESSAGING_INTERNAL_URL: http://marketing-api:8000
      OPERATIONS_PUBLIC_URL: https://operations.teleautomation.online
      MARKETING_PUBLIC_URL: https://marketing.teleautomation.online
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?}
      DASHBOARD_USERNAME: ${OPERATIONS_DASHBOARD_USERNAME:?}
      DASHBOARD_PASSWORD: ${OPERATIONS_DASHBOARD_PASSWORD:?}
      DASHBOARD_AUTH_SECRET: ${OPERATIONS_AUTH_SECRET:?}
      DASHBOARD_COOKIE_SECURE: "true"
      TELEAUTOMATION_SAFE_UI_MODE: "false"

      # Decrypts stored mailbox credentials. Carried from the monolith, never
      # regenerated: a new key makes every saved mailbox credential
      # undecryptable, and the failure looks like the mailboxes were lost.
      MAILBOX_CREDENTIAL_ENCRYPTION_KEY: ${MAILBOX_CREDENTIAL_ENCRYPTION_KEY:?}

      # Google OAuth and Gmail push. The redirect URI must match what is
      # registered in the Google console, which moves to this subdomain.
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-https://operations.teleautomation.online/api/candidate-mailboxes/oauth/google/callback}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      GMAIL_PUBSUB_VERIFICATION_TOKEN: ${GMAIL_PUBSUB_VERIFICATION_TOKEN:-}

      # Gates the recruitment-mail feature surface. Left unset, its routes
      # answer 404 and Gmail push delivery has nowhere to land.
      AI_INTERVIEW_OFFER_TRACKING_ENABLED: ${AI_INTERVIEW_OFFER_TRACKING_ENABLED:?}
      AI_MAILBOX_SYNC_ENABLED: ${AI_MAILBOX_SYNC_ENABLED:?}

      # Carried from the monolith: the recruitment AI pipeline, the Ollama
      # pool and the payment extraction settings all live here.
      AI_API_KEY: ${AI_API_KEY:?}
      OPS_API_TOKEN: ${OPS_API_TOKEN:?}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_REASONING_MODEL: ${OLLAMA_REASONING_MODEL:-}
      AI_INTERVIEW_AUTO_BOOKING_ENABLED: ${AI_INTERVIEW_AUTO_BOOKING_ENABLED:-}
      AI_INTERVIEW_DEFAULT_TIMEZONE: ${AI_INTERVIEW_DEFAULT_TIMEZONE:-}
      AI_INTERVIEW_DEFAULT_TIMEZONE_DOMAINS: ${AI_INTERVIEW_DEFAULT_TIMEZONE_DOMAINS:-}
      AI_JOB_TIMEOUT: ${AI_JOB_TIMEOUT:-}
      AI_MAIL_AI_LEASE_SECONDS: ${AI_MAIL_AI_LEASE_SECONDS:-}
      AI_MAIL_AI_RETRY_BATCH_SIZE: ${AI_MAIL_AI_RETRY_BATCH_SIZE:-}
      AI_MAIL_AUDIT_AI_INTERVAL_SECONDS: ${AI_MAIL_AUDIT_AI_INTERVAL_SECONDS:-}
      AI_MAIL_INGESTION_LEASE_MINUTES: ${AI_MAIL_INGESTION_LEASE_MINUTES:-}
      AI_MAIL_SYNC_BATCH_SIZE: ${AI_MAIL_SYNC_BATCH_SIZE:-}
      AI_OFFER_VERIFICATION_ENABLED: ${AI_OFFER_VERIFICATION_ENABLED:-}
      AI_OLLAMA_MAX_CONCURRENCY: ${AI_OLLAMA_MAX_CONCURRENCY:-}
      AI_RECRUITMENT_AUTO_ACCEPT_THRESHOLD: ${AI_RECRUITMENT_AUTO_ACCEPT_THRESHOLD:-}
      AI_RECRUITMENT_JOB_TIMEOUT_SECONDS: ${AI_RECRUITMENT_JOB_TIMEOUT_SECONDS:-}
      AI_RECRUITMENT_MODEL: ${AI_RECRUITMENT_MODEL:-}
      AI_RECRUITMENT_QUEUE_WAIT_SECONDS: ${AI_RECRUITMENT_QUEUE_WAIT_SECONDS:-}
      AI_RECRUITMENT_REQUEST_TIMEOUT_SECONDS: ${AI_RECRUITMENT_REQUEST_TIMEOUT_SECONDS:-}
      AI_RECRUITMENT_VALIDATOR_MODEL: ${AI_RECRUITMENT_VALIDATOR_MODEL:-}
      INVITE_EXTRACTION_MODE: ${INVITE_EXTRACTION_MODE:-}
      OLLAMA_BACKUP_VISION_MODEL: ${OLLAMA_BACKUP_VISION_MODEL:-}
      OLLAMA_CONNECT_TIMEOUT: ${OLLAMA_CONNECT_TIMEOUT:-}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-}
      OLLAMA_EXPECT_REVERSE_SSH_TUNNEL: ${OLLAMA_EXPECT_REVERSE_SSH_TUNNEL:-}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-}
      OLLAMA_HEALTH_TIMEOUT_SECONDS: ${OLLAMA_HEALTH_TIMEOUT_SECONDS:-}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-}
      OLLAMA_MAX_RETRIES: ${OLLAMA_MAX_RETRIES:-}
      # All three pool nodes resolve from their own variable in
      # core/ollama_nodes.py, but only Jagadeesh was ever passed through,
      # so rtx4060 and our_machine were stuck on their in-code defaults of
      # 127.0.0.1 - which inside a container is the container, never the
      # host. They could not be pointed at a tunnel at all.
      OLLAMA_NODE_JAGADEESH_URL: ${OLLAMA_NODE_JAGADEESH_URL:-}
      OLLAMA_NODE_OUR_MACHINE_URL: ${OLLAMA_NODE_OUR_MACHINE_URL:-}
      OLLAMA_NODE_RTX4060_URL: ${OLLAMA_NODE_RTX4060_URL:-}
      OLLAMA_PRIMARY_MODEL: ${OLLAMA_PRIMARY_MODEL:-}
      OLLAMA_REMOTE_ENABLED: ${OLLAMA_REMOTE_ENABLED:-}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-}
      OLLAMA_RESPONSE_TIMEOUT_SECONDS: ${OLLAMA_RESPONSE_TIMEOUT_SECONDS:-}
      OLLAMA_RETRY_COUNT: ${OLLAMA_RETRY_COUNT:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-}
      PAYMENT_EXTRACTION_PROVIDER: ${PAYMENT_EXTRACTION_PROVIDER:-}
      PAYMENT_VERIFICATION_OCR_ENABLED: ${PAYMENT_VERIFICATION_OCR_ENABLED:-}
      REFERRER_RECEIVER_FLOW_ENABLED: ${REFERRER_RECEIVER_FLOW_ENABLED:-}
      # Real company receiver identity is mandatory. Without a configured UPI
      # handle and receiver name, Operations falls back to fixture placeholders
      # and rejects genuine production receipts as receiver conflicts. Phone
      # and account-number identifiers are optional but must be passed through
      # when configured so every accepted payment rail uses the same registry.
      COMPANY_PAYMENT_UPI_IDS: ${COMPANY_PAYMENT_UPI_IDS:?}
      COMPANY_PAYMENT_PHONE_NUMBERS: ${COMPANY_PAYMENT_PHONE_NUMBERS:-}
      COMPANY_PAYMENT_ACCOUNT_NUMBERS: ${COMPANY_PAYMENT_ACCOUNT_NUMBERS:-}
      COMPANY_PAYMENT_RECEIVER_NAMES: ${COMPANY_PAYMENT_RECEIVER_NAMES:?}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      PAYMENT_ENGINE_V2_ENABLED: ${PAYMENT_ENGINE_V2_ENABLED:-false}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${OPERATIONS_PORT:-8210}:8000"]
    volumes:
      - operations_data:/var/lib/teleautomation-operations
    depends_on:
      operations-db: { condition: service_healthy }
      operations-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *capped

volumes:
  marketing_data:
  marketing_db:
  operations_data:
  operations_db:
