name: ci

# `on: [push, pull_request]` ran this workflow twice for every branch with a PR
# open: once for the push, once for the pull_request, executing both jobs both
# times. Restricting push to main keeps the post-merge run and drops only the
# duplicate.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository. Saying so removes the dependence on a
# repository-level default that can change without touching this file, and that
# already differed between the two repositories.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: marketing_ci, POSTGRES_PASSWORD: marketing_ci, POSTGRES_DB: marketing_ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketing_ci" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://marketing_ci:marketing_ci@localhost:5432/marketing_ci
      DASHBOARD_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: pip check
      - run: python -m core.migrations.runner
      - name: Verify migrations are idempotent
        run: test -z "$(python -m core.migrations.runner)"
      - run: python -m compileall -q core services workers features events messaging main.py
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: npm ci
        working-directory: dashboard
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: dashboard
      - run: npm test -- --run
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - name: Validate authoritative production Compose
        env:
          RELEASE_SHA_MARKETING: marketing-candidate-under-test
          MARKETING_DB_USER: marketing_validation
          MARKETING_DB_PASSWORD: validation-only
          MARKETING_DB_NAME: marketing_validation
          MARKETING_DATABASE_URL: postgresql://marketing_validation:validation-only@marketing-db:5432/marketing_validation
          OPERATIONS_DB_USER: operations_validation
          OPERATIONS_DB_PASSWORD: validation-only
          OPERATIONS_DB_NAME: operations_validation
          OPERATIONS_DATABASE_URL: postgresql://operations_validation:validation-only@operations-db:5432/operations_validation
          INTERNAL_SERVICE_TOKEN: validation-only
          MARKETING_DASHBOARD_USERNAME: validation
          MARKETING_DASHBOARD_PASSWORD: validation-only
          MARKETING_AUTH_SECRET: validation-only
          OPERATIONS_DASHBOARD_USERNAME: validation
          OPERATIONS_DASHBOARD_PASSWORD: validation-only
          OPERATIONS_AUTH_SECRET: validation-only
          OPS_API_TOKEN: validation-only
          TELEGRAM_API_ID: validation-only
          TELEGRAM_API_HASH: validation-only
          WHATSAPP_ENABLED: "true"
          WHATSAPP_API_KEY: validation-only
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: validation-only
          WHATSAPP_WEBHOOK_SECRET: validation-only
          AI_API_KEY: validation-only
          MAILBOX_CREDENTIAL_ENCRYPTION_KEY: validation-only
          GOOGLE_OAUTH_CLIENT_ID: validation-only
          GOOGLE_OAUTH_CLIENT_SECRET: validation-only
          AI_INTERVIEW_OFFER_TRACKING_ENABLED: "true"
          AI_MAILBOX_SYNC_ENABLED: "true"
          COMPANY_PAYMENT_UPI_IDS: validation@upi
          COMPANY_PAYMENT_RECEIVER_NAMES: Validation Receiver
        run: docker compose -f docker-compose.production.yml config --quiet
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d
        env: {TELEAUTOMATION_SAFE_UI_MODE: "true"}
      - name: Health check
        run: curl --fail --retry 24 --retry-delay 5 --retry-all-errors http://127.0.0.1:8100/health
      - name: Migrations ran inside the container and are idempotent
        run: |
          docker compose run --rm -T migrate | tee /tmp/second-run.txt
          test ! -s /tmp/second-run.txt
      - name: Persistence survives a container restart
        run: |
          docker compose exec -T db psql -U marketing -d marketing -c \
            "CREATE TABLE IF NOT EXISTS ci_persistence_probe(id int primary key); \
             INSERT INTO ci_persistence_probe VALUES (1) ON CONFLICT DO NOTHING;"
          docker compose restart
          curl --fail --retry 24 --retry-delay 5 --retry-all-errors http://127.0.0.1:8100/health
          test "$(docker compose exec -T db psql -U marketing -d marketing -tAc \
            'SELECT count(*) FROM ci_persistence_probe' | tr -d '[:space:]')" = "1"
      - if: always()
        run: docker compose down -v

  # True dual-service verification needs BOTH private repositories checked out.
  # It runs only when a token with read access to the peer repository is
  # configured; otherwise it reports why it was skipped instead of silently
  # passing. See scripts/dual_service_test.sh for the checks performed.
  dual-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Enough history to check out a real previous commit for the rollback
        # rehearsal; a shallow clone cannot roll back to anything.
        with: {path: teleautomation-messaging, fetch-depth: 0}
      - name: Check peer access
        id: peer
        run: |
          if [ -n "${{ secrets.PEER_REPO_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dual-service verification SKIPPED: secret PEER_REPO_TOKEN is not set, so the private Operations repository cannot be checked out."
          fi
      # Paired changes are made on identically named branches in both
      # repositories and merge together, so when the peer has a branch of the
      # same name that pair is the combination that will actually ship: verify
      # against it. Otherwise use the peer's default branch. Checking out the
      # default branch unconditionally would pair new Marketing code with
      # whatever Operations happened to have last merged, which for a paired
      # change is a combination that never ships.
      #
      # Matching on the branch name rather than a hardcoded one means this needs
      # no edit per change, and it falls back on its own once a peer branch
      # merges and is deleted.
      - name: Resolve peer ref
        id: peerref
        if: steps.peer.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.PEER_REPO_TOKEN }}
          PEER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$PEER_BRANCH" ] \
             && gh api "repos/codetrust2025-spec/teleautomation-business/branches/$PEER_BRANCH" >/dev/null 2>&1; then
            echo "ref=$PEER_BRANCH" >> "$GITHUB_OUTPUT"
            echo "::notice::Verifying against matching peer branch $PEER_BRANCH"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "::notice::No peer branch named '$PEER_BRANCH'; verifying against the peer default branch"
          fi
      - uses: actions/checkout@v4
        if: steps.peer.outputs.available == 'true'
        with:
          repository: codetrust2025-spec/teleautomation-business
          ref: ${{ steps.peerref.outputs.ref }}
          token: ${{ secrets.PEER_REPO_TOKEN }}
          path: teleautomation-business
      # The three verifications -- dual-service contracts, the staging stack
      # over HTTP, and the backup/restore/rollback rehearsal -- live in one
      # script that Operations CI runs too, so both repositories verify the
      # same thing. It tears its stacks down on exit, pass or fail.
      - name: Cross-repository verification
        if: steps.peer.outputs.available == 'true'
        working-directory: teleautomation-messaging
        run: bash scripts/ci_dual_service.sh

  # One check that always runs and always reflects the whole workflow.
  #
  # Neither repository has branch protection -- private repositories on this
  # plan cannot -- so nothing on GitHub's side requires a status before a merge.
  # The only gate is `gh pr checks --watch` in fix_and_deploy.sh. A workflow
  # whose every job can be skipped could therefore present nothing to fail on,
  # so this job runs unconditionally and fails unless the lane that was actually
  # selected succeeded.
  ci:
    needs: [verify, dual-service]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          VERIFY: ${{ needs.verify.result }}
          DUAL: ${{ needs.dual-service.result }}
        run: |
          set -eu
          echo "verify=$VERIFY dual-service=$DUAL"
          [ "$VERIFY" = success ] || { echo "::error::verify failed"; exit 1; }
          [ "$DUAL" = success ] || { echo "::error::dual-service failed"; exit 1; }
          echo "ci gate passed"
