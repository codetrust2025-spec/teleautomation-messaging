name: ci

# `on: [push, pull_request]` ran this workflow twice for every branch with a PR
# open: once for the push, once for the pull_request, executing both jobs both
# times. Restricting push to main keeps the post-merge run -- the safety net the
# pin lane below depends on -- and drops only the duplicate.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A release pin changes two files by one line each: the anchor in
  # docker-compose.production.yml and the same SHA in the contract test. Nothing
  # else in Marketing changes, so Marketing's suite, dashboard, image build and
  # container checks would run against identical inputs.
  #
  # Deciding the pin lane takes two answers, and both must be yes:
  #   1. is this Marketing change nothing but a pin?   scripts/pin_lane.sh
  #   2. is the Operations range it pins frontend-only? the Operations repo's
  #      own scripts/ci_lane.sh, fetched at the commit being pinned, so the rule
  #      that applies is the one that shipped with that commit
  # Anything unresolved -- no peer token, a failed compare, an unreadable
  # anchor -- is `full`.
  classify:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.pick.outputs.lane }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PEER_TOKEN: ${{ secrets.PEER_REPO_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PEER: codetrust2025-spec/teleautomation-business
        run: |
          set -uo pipefail
          decide() { echo "lane=$1" >> "$GITHUB_OUTPUT"; echo "::notice::lane=$1 ($2)"; exit 0; }

          # A push to main always runs everything. The pin lane is a pre-merge
          # gate only, so every commit that lands still gets the full pipeline.
          [ "$EVENT" = "pull_request" ] || decide full "event is $EVENT"

          FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename') || FILES=""
          echo "changed files:"; printf '%s\n' "$FILES" | sed 's/^/  /'
          SHAPE=$(printf '%s\n' "$FILES" | bash scripts/pin_lane.sh)
          [ "$SHAPE" = pin ] || decide full "Marketing change is not a pin"

          # The anchors on either side of this PR.
          anchor() { sed -n 's/.*operations: &operations-release \([0-9a-f]\{40\}\).*/\1/p' "$1" | head -1; }
          NEW=$(anchor docker-compose.production.yml)
          git show "$BASE:docker-compose.production.yml" > /tmp/base-compose.yml 2>/dev/null || true
          OLD=$(anchor /tmp/base-compose.yml)
          echo "anchor $OLD -> $NEW"
          [ -n "$OLD" ] && [ -n "$NEW" ] || decide full "could not read both anchors"
          [ "$OLD" != "$NEW" ] || decide full "anchor did not move"

          [ -n "$PEER_TOKEN" ] || decide full "no peer token, cannot inspect the Operations range"

          # What the pinned Operations range actually changed, and the lane rule
          # as it exists at the new commit.
          export GH_TOKEN="$PEER_TOKEN"
          OPS_FILES=$(gh api "repos/$PEER/compare/$OLD...$NEW" --jq '.files[].filename') \
            || decide full "could not compare the Operations range"
          [ -n "$OPS_FILES" ] || decide full "Operations compare returned no files"
          echo "operations files in $OLD..$NEW:"; printf '%s\n' "$OPS_FILES" | sed 's/^/  /'
          gh api "repos/$PEER/contents/scripts/ci_lane.sh?ref=$NEW" --jq '.content' \
            | base64 -d > /tmp/ci_lane.sh || decide full "could not fetch the Operations lane rule"
          [ -s /tmp/ci_lane.sh ] || decide full "Operations lane rule was empty"
          OPS_LANE=$(printf '%s\n' "$OPS_FILES" | bash /tmp/ci_lane.sh)
          [ "$OPS_LANE" = frontend ] || decide full "Operations range is $OPS_LANE"

          decide pin "pin of a frontend-only Operations range"

  # Pin lane. Runs the two checks a pin can actually break, and nothing else.
  #
  #   - `docker compose -f docker-compose.production.yml config --quiet` proves
  #     the production stack still resolves with the new anchor.
  #   - the contract test asserts the anchor is present, appears for both
  #     images, and matches the SHA the test itself records.
  #
  # What is skipped, and why it cannot be affected by this change:
  #   - Marketing's Python suite, dashboard suite, image build, health,
  #     migration and persistence checks: no Marketing source changed.
  #   - dual-service: it exercises the cross-service HTTP contracts, which are
  #     implemented in Operations Python. This lane is only chosen when the
  #     pinned Operations range touched dashboard source alone.
  #   - the staging stack and the backup/restore/rollback rehearsal: they run
  #     against docker-compose.staging.yml with RELEASE_SHA_OPERATIONS pinned to
  #     the literal `peer-under-test`. They never read the production anchor, so
  #     a pin cannot change their outcome.
  pin:
    needs: classify
    if: needs.classify.outputs.lane == 'pin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - name: Validate authoritative production Compose
        env:
          RELEASE_SHA_MARKETING: marketing-candidate-under-test
          MARKETING_DB_USER: marketing_validation
          MARKETING_DB_PASSWORD: validation-only
          MARKETING_DB_NAME: marketing_validation
          MARKETING_DATABASE_URL: postgresql://marketing_validation:validation-only@marketing-db:5432/marketing_validation
          OPERATIONS_DB_USER: operations_validation
          OPERATIONS_DB_PASSWORD: validation-only
          OPERATIONS_DB_NAME: operations_validation
          OPERATIONS_DATABASE_URL: postgresql://operations_validation:validation-only@operations-db:5432/operations_validation
          INTERNAL_SERVICE_TOKEN: validation-only
          MARKETING_DASHBOARD_USERNAME: validation
          MARKETING_DASHBOARD_PASSWORD: validation-only
          MARKETING_AUTH_SECRET: validation-only
          OPERATIONS_DASHBOARD_USERNAME: validation
          OPERATIONS_DASHBOARD_PASSWORD: validation-only
          OPERATIONS_AUTH_SECRET: validation-only
          OPS_API_TOKEN: validation-only
          TELEGRAM_API_ID: validation-only
          TELEGRAM_API_HASH: validation-only
          WHATSAPP_ENABLED: "true"
          WHATSAPP_API_KEY: validation-only
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: validation-only
          WHATSAPP_WEBHOOK_SECRET: validation-only
          AI_API_KEY: validation-only
          MAILBOX_CREDENTIAL_ENCRYPTION_KEY: validation-only
          GOOGLE_OAUTH_CLIENT_ID: validation-only
          GOOGLE_OAUTH_CLIENT_SECRET: validation-only
          AI_INTERVIEW_OFFER_TRACKING_ENABLED: "true"
          AI_MAILBOX_SYNC_ENABLED: "true"
          COMPANY_PAYMENT_UPI_IDS: validation@upi
          COMPANY_PAYMENT_RECEIVER_NAMES: Validation Receiver
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Release contract
        run: python -m pytest -q tests/test_production_compose_contract.py tests/test_pin_lane_selection.py

  verify:
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: marketing_ci, POSTGRES_PASSWORD: marketing_ci, POSTGRES_DB: marketing_ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketing_ci" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://marketing_ci:marketing_ci@localhost:5432/marketing_ci
      DASHBOARD_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: pip check
      - run: python -m core.migrations.runner
      - name: Verify migrations are idempotent
        run: test -z "$(python -m core.migrations.runner)"
      - run: python -m compileall -q core services workers features events messaging main.py
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: npm ci
        working-directory: dashboard
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: dashboard
      - run: npm test -- --run
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - name: Validate authoritative production Compose
        env:
          RELEASE_SHA_MARKETING: marketing-candidate-under-test
          MARKETING_DB_USER: marketing_validation
          MARKETING_DB_PASSWORD: validation-only
          MARKETING_DB_NAME: marketing_validation
          MARKETING_DATABASE_URL: postgresql://marketing_validation:validation-only@marketing-db:5432/marketing_validation
          OPERATIONS_DB_USER: operations_validation
          OPERATIONS_DB_PASSWORD: validation-only
          OPERATIONS_DB_NAME: operations_validation
          OPERATIONS_DATABASE_URL: postgresql://operations_validation:validation-only@operations-db:5432/operations_validation
          INTERNAL_SERVICE_TOKEN: validation-only
          MARKETING_DASHBOARD_USERNAME: validation
          MARKETING_DASHBOARD_PASSWORD: validation-only
          MARKETING_AUTH_SECRET: validation-only
          OPERATIONS_DASHBOARD_USERNAME: validation
          OPERATIONS_DASHBOARD_PASSWORD: validation-only
          OPERATIONS_AUTH_SECRET: validation-only
          OPS_API_TOKEN: validation-only
          TELEGRAM_API_ID: validation-only
          TELEGRAM_API_HASH: validation-only
          WHATSAPP_ENABLED: "true"
          WHATSAPP_API_KEY: validation-only
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: validation-only
          WHATSAPP_WEBHOOK_SECRET: validation-only
          AI_API_KEY: validation-only
          MAILBOX_CREDENTIAL_ENCRYPTION_KEY: validation-only
          GOOGLE_OAUTH_CLIENT_ID: validation-only
          GOOGLE_OAUTH_CLIENT_SECRET: validation-only
          AI_INTERVIEW_OFFER_TRACKING_ENABLED: "true"
          AI_MAILBOX_SYNC_ENABLED: "true"
          COMPANY_PAYMENT_UPI_IDS: validation@upi
          COMPANY_PAYMENT_RECEIVER_NAMES: Validation Receiver
        run: docker compose -f docker-compose.production.yml config --quiet
      - run: cp .env.example .env
      - run: docker compose build
      - run: docker compose up -d
        env: {TELEAUTOMATION_SAFE_UI_MODE: "true"}
      - name: Health check
        run: curl --fail --retry 24 --retry-delay 5 --retry-all-errors http://127.0.0.1:8100/health
      - name: Migrations ran inside the container and are idempotent
        run: |
          docker compose run --rm -T migrate | tee /tmp/second-run.txt
          test ! -s /tmp/second-run.txt
      - name: Persistence survives a container restart
        run: |
          docker compose exec -T db psql -U marketing -d marketing -c \
            "CREATE TABLE IF NOT EXISTS ci_persistence_probe(id int primary key); \
             INSERT INTO ci_persistence_probe VALUES (1) ON CONFLICT DO NOTHING;"
          docker compose restart
          curl --fail --retry 24 --retry-delay 5 --retry-all-errors http://127.0.0.1:8100/health
          test "$(docker compose exec -T db psql -U marketing -d marketing -tAc \
            'SELECT count(*) FROM ci_persistence_probe' | tr -d '[:space:]')" = "1"
      - if: always()
        run: docker compose down -v

  # True dual-service verification needs BOTH private repositories checked out.
  # It runs only when a token with read access to the peer repository is
  # configured; otherwise it reports why it was skipped instead of silently
  # passing. See scripts/dual_service_test.sh for the checks performed.
  dual-service:
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Enough history to check out a real previous commit for the rollback
        # rehearsal; a shallow clone cannot roll back to anything.
        with: {path: teleautomation-messaging, fetch-depth: 0}
      - name: Check peer access
        id: peer
        run: |
          if [ -n "${{ secrets.PEER_REPO_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dual-service verification SKIPPED: secret PEER_REPO_TOKEN is not set, so the private Operations repository cannot be checked out."
          fi
      # Paired changes are made on identically named branches in both
      # repositories and merge together, so when the peer has a branch of the
      # same name that pair is the combination that will actually ship: verify
      # against it. Otherwise use the peer's default branch. Checking out the
      # default branch unconditionally would pair new Marketing code with
      # whatever Operations happened to have last merged, which for a paired
      # change is a combination that never ships.
      #
      # Matching on the branch name rather than a hardcoded one means this needs
      # no edit per change, and it falls back on its own once a peer branch
      # merges and is deleted.
      - name: Resolve peer ref
        id: peerref
        if: steps.peer.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.PEER_REPO_TOKEN }}
          PEER_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$PEER_BRANCH" ] \
             && gh api "repos/codetrust2025-spec/teleautomation-business/branches/$PEER_BRANCH" >/dev/null 2>&1; then
            echo "ref=$PEER_BRANCH" >> "$GITHUB_OUTPUT"
            echo "::notice::Verifying against matching peer branch $PEER_BRANCH"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "::notice::No peer branch named '$PEER_BRANCH'; verifying against the peer default branch"
          fi
      - uses: actions/checkout@v4
        if: steps.peer.outputs.available == 'true'
        with:
          repository: codetrust2025-spec/teleautomation-business
          ref: ${{ steps.peerref.outputs.ref }}
          token: ${{ secrets.PEER_REPO_TOKEN }}
          path: teleautomation-business
      - name: Run dual-service verification
        if: steps.peer.outputs.available == 'true'
        working-directory: teleautomation-messaging
        run: bash scripts/dual_service_test.sh
      - name: Tear down
        if: always() && steps.peer.outputs.available == 'true'
        working-directory: teleautomation-messaging
        run: docker compose -f docker-compose.dual.yml down -v

      # The staging stack adds TLS termination and two public hostnames on top
      # of the dual-service stack. Automatic certificates need a public IP that
      # CI does not have, but everything that actually breaks on first deploy --
      # the compose wiring, the migrations, the release SHA baked into the
      # image, the reverse proxy and the WebSocket upgrade -- is testable here
      # over plain HTTP against the same files. Finding those now is far cheaper
      # than finding them once a host exists.
      - name: Validate the staging stack over plain HTTP
        if: steps.peer.outputs.available == 'true'
        working-directory: teleautomation-messaging
        env:
          STAGING_IP: 127.0.0.1
          MARKETING_SITE: http://marketing.test
          OPERATIONS_SITE: http://operations.test
          MARKETING_DB_PASSWORD: ci-marketing-db
          OPERATIONS_DB_PASSWORD: ci-operations-db
          INTERNAL_SERVICE_TOKEN: ci-internal-token
          MARKETING_DASHBOARD_PASSWORD: ci-marketing-dash
          MARKETING_AUTH_SECRET: ci-marketing-secret
          OPERATIONS_DASHBOARD_PASSWORD: ci-operations-dash
          OPERATIONS_AUTH_SECRET: ci-operations-secret
        run: |
          set -euo pipefail
          export RELEASE_SHA_MARKETING="${{ github.sha }}"
          export RELEASE_SHA_OPERATIONS=peer-under-test
          # --profile edge starts Caddy. This job exercises the standalone
          # topology where staging owns 80/443; without the profile Caddy is
          # skipped and every proxy assertion below tests nothing.
          docker compose -f docker-compose.staging.yml --profile edge up -d --build
          bash scripts/staging_stack_check.sh

      # Backup, restore and rollback are STAGING VERIFIED gates. Exercising them
      # here means they are known to work before a host exists, rather than
      # being discovered broken at the moment they are needed.
      - name: Verify backup, restore and rollback
        if: steps.peer.outputs.available == 'true'
        working-directory: teleautomation-messaging
        env:
          STAGING_IP: 127.0.0.1
          MARKETING_SITE: http://marketing.test
          OPERATIONS_SITE: http://operations.test
          MARKETING_DB_PASSWORD: ci-marketing-db
          OPERATIONS_DB_PASSWORD: ci-operations-db
          INTERNAL_SERVICE_TOKEN: ci-internal-token
          MARKETING_DASHBOARD_PASSWORD: ci-marketing-dash
          MARKETING_AUTH_SECRET: ci-marketing-secret
          OPERATIONS_DASHBOARD_PASSWORD: ci-operations-dash
          OPERATIONS_AUTH_SECRET: ci-operations-secret
        run: |
          set -euo pipefail
          export RELEASE_SHA_MARKETING="${{ github.sha }}"
          export RELEASE_SHA_OPERATIONS=peer-under-test
          bash scripts/staging_backup.sh backups/ci
          bash scripts/staging_restore.sh backups/ci

          # Roll Marketing back one commit while Operations stays put. Beyond
          # proving rollback works, this proves the two services are genuinely
          # independently deployable: reverting one must not require touching
          # the other, which is the property the whole split exists for.
          PREV=$(git rev-parse HEAD~1)
          MARKETING_SHA="$PREV" bash scripts/staging_rollback.sh

          # Return to the release under test so the stack is left as found.
          git checkout --quiet "${{ github.sha }}" 2>/dev/null || git checkout --quiet -
          RELEASE_SHA_MARKETING="${{ github.sha }}" \
            docker compose -f docker-compose.staging.yml up -d --build marketing-api

      - name: Tear down the staging stack
        if: always() && steps.peer.outputs.available == 'true'
        working-directory: teleautomation-messaging
        env:
          STAGING_IP: 127.0.0.1
          MARKETING_DB_PASSWORD: x
          OPERATIONS_DB_PASSWORD: x
          INTERNAL_SERVICE_TOKEN: x
          MARKETING_DASHBOARD_PASSWORD: x
          MARKETING_AUTH_SECRET: x
          OPERATIONS_DASHBOARD_PASSWORD: x
          OPERATIONS_AUTH_SECRET: x
        run: docker compose -f docker-compose.staging.yml --profile edge down -v

  # One check that always runs and always reflects the whole workflow.
  #
  # Neither repository has branch protection -- private repositories on this
  # plan cannot -- so nothing on GitHub's side requires a status before a merge.
  # The only gate is `gh pr checks --watch` in fix_and_deploy.sh. A workflow
  # whose every job can be skipped could therefore present nothing to fail on,
  # so this job runs unconditionally and fails unless the lane that was actually
  # selected succeeded.
  ci:
    needs: [classify, pin, verify, dual-service]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          LANE: ${{ needs.classify.outputs.lane }}
          CLASSIFY: ${{ needs.classify.result }}
          PIN: ${{ needs.pin.result }}
          VERIFY: ${{ needs.verify.result }}
          DUAL: ${{ needs.dual-service.result }}
        run: |
          set -eu
          echo "lane=$LANE classify=$CLASSIFY pin=$PIN verify=$VERIFY dual-service=$DUAL"
          if [ "$CLASSIFY" != success ]; then
            echo "::error::classification failed"; exit 1
          fi
          case "$LANE" in
            pin)
              [ "$PIN" = success ] || { echo "::error::pin lane failed"; exit 1; }
              [ "$VERIFY" = skipped ] || { echo "::error::verify should be skipped on the pin lane"; exit 1; }
              [ "$DUAL" = skipped ] || { echo "::error::dual-service should be skipped on the pin lane"; exit 1; }
              ;;
            full)
              [ "$VERIFY" = success ] || { echo "::error::verify failed"; exit 1; }
              [ "$DUAL" = success ] || { echo "::error::dual-service failed"; exit 1; }
              [ "$PIN" = skipped ] || { echo "::error::pin should be skipped on the full lane"; exit 1; }
              ;;
            *)
              echo "::error::unknown lane '$LANE'"; exit 1
              ;;
          esac
          echo "ci gate passed on the $LANE lane"
