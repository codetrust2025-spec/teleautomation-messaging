# systemd drop-in for nginx.service.
# Install to /etc/systemd/system/nginx.service.d/10-temp-dir-ownership.conf
# then `systemctl daemon-reload && systemctl restart nginx`.
#
# nginx spills any proxied response larger than its in-memory buffers - and any
# client upload larger than client_body_buffer_size - into these directories.
# If the worker user cannot write there, nginx TRUNCATES the response at the
# buffered amount and still returns HTTP 200 with an honest Content-Length.
#
# Found in production 2026-08-27 owned by nobody:root while workers run as
# www-data. A 566KB JS bundle was delivered cut to ~98KB, so the ES module never
# executed, React never mounted, and /submit-slot rendered blank on both
# hostnames - no console error, no 5xx, nothing in the access log to suggest it.
# Uploads were affected too: /var/lib/nginx/body is where the submit-slot invite
# screenshot, payment proofs and resumes land when they exceed the buffer.
#
# Reassert ownership on every start, so a reboot, a package update, or anything
# that recreates these directories cannot bring the silent truncation back.
[Service]
ExecStartPre=/bin/mkdir -p /var/lib/nginx/proxy /var/lib/nginx/body /var/lib/nginx/fastcgi /var/lib/nginx/uwsgi /var/lib/nginx/scgi
ExecStartPre=/bin/chown -R www-data:www-data /var/lib/nginx/proxy /var/lib/nginx/body /var/lib/nginx/fastcgi /var/lib/nginx/uwsgi /var/lib/nginx/scgi
